claims:
  - claim: "The previous video streamed a Mac mini running Linux at fifty-six frames a second, software encoded"
    source: videos/wayland-asahi (https://youtu.be/q1Fgc3nM3W4); https://github.com/gjovanov/roomler-ai/blob/master/docs/fr/FR-112-software-encoding-at-60-fps.md
  - claim: "Because Asahi has no driver for the Mac's video encoding hardware"
    source: the previous video's own words; FR-112 §2 (software encoding on Asahi)
  - claim: "Roomler, in the same browser tab, shows 120 frames per second on the MacBook with macOS"
    source: https://github.com/gjovanov/roomler-ai/blob/master/docs/fr/FR-119-high-refresh-streaming.md (AC4, met 2026-10-24 on 0.4.162); the viewer's fps pill in the takes, enlarged
  - claim: "The counter is the browser counting the frames it decodes"
    source: the viewer's fps pill in the takes, read every 15th frame: 117-121 in 186 of 223 samples, 110-133 overall
  - claim: "VideoToolbox encodes a full frame in about six milliseconds; at 120 fps each frame gets 8.3"
    source: FR-119 §2 (6.3 ms, hevc_videotoolbox, 3024x1964; 120 fps needs at most 8.3 ms per frame)
  - claim: "The Intel and Nvidia encoders we measured needed ten to twelve milliseconds"
    source: FR-119 §2 (from FR-118 §2.2, a 7-day fleet read: 10.6 ms hevc_qsv 1080p, 11.9 ms av1_qsv 1200p, 9.9 ms av1_nvenc 1200p), on today's encode path
  - claim: "Typing feels like working with a local desktop"
    source: Goran's own impression, over his own recording (window drags and typing, full screen)
  - claim: "The video you're watching runs at thirty frames a second"
