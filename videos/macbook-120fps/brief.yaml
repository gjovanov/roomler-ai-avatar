  - claim: "Every two seconds the Mac writes down how many frames it sent: about 120"
    source: the Mac's roomlerd log, the DC pump heartbeat of the take's session (117.5-120.5 fps per window), the terminal shot in this video
  - claim: "The stream goes straight from the MacBook to the browser, peer to peer, and the browser decodes it on its GPU"
    source: the viewer's pills in the takes ("direct", "dec HW"), enlarged
  - claim: "No plugin; nothing to install on the controlling side"
    source: https://github.com/gjovanov/roomler-ai#readme
  - claim: "GPU encoding of the screen makes the difference; a home MacBook reached from the office feels local"
