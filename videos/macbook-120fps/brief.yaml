# The brief for videos/macbook-120fps: what the video may claim, each claim with its source.
product: Roomler
about: one open-source product for remote desktop from any browser, a private WireGuard mesh between your machines, and team chat and video calls
end_title: roomler.ai
end_subtitle: Open source · self-hostable
footage:
  - what: "The MacBook in a browser tab at 120 fps: the color test video, the window drags, the counter, the codec pill, the typing of \"Nothing to install on this side\""
    source: takes recorded 2026-10-24 from Edge on the Windows laptop, direct to the MacBook (macOS, Roomler 0.4.163), 1664x1088 at 120 fps (the Mac's log 117.5-120.5 fps per 2 s window)
  - what: "The \"work on it\" block: full screen in the tab, fast window drags, then typing in TextEdit"
