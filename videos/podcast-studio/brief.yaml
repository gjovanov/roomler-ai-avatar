product: Roomler
about: one open-source product for remote desktop from any browser, a private WireGuard mesh between your machines, and team chat and video calls
format: a podcast-style conversation, 16:9; two framed cameras over a studio (the host left, the guest right, the one speaking live), demos full frame, cards for "what is it" and "who is it for", a title and an end card
end_title: roomler.ai
end_subtitle: Open source · self-hostable
